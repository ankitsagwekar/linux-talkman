set timeout=7

menuentry "postmarketOS (Lumia 950)" {
	set background_color=black
	insmod part_gpt
	insmod fat
	insmod search_label
	# Find the pmOS boot partition by its label instead of a fixed number
	search --no-floppy --label pmOS_boot --set=root

	# No "quiet": show kernel messages on screen while debugging.
	# consoleblank=180: black screen after 3 minutes without a key press.
	linux /vmlinuz acpi=no earlycon=efifb console=tty0 consoleblank=180 ignore_loglevel clk_ignore_unused pd_ignore_unused pmos_rootfsopts=defaults
	initrd /initramfs
	devicetree /msm8992-msft-lumia-octagon-talkman.dtb
}

menuentry "previous kernel (fallback)" {
	set background_color=black
	insmod part_gpt
	insmod fat
	insmod search_label
	search --no-floppy --label pmOS_boot --set=root

	# The kernel and device tree that ota-update.sh kept from before the
	# last update.
	linux /vmlinuz.prev acpi=no earlycon=efifb console=tty0 consoleblank=180 ignore_loglevel clk_ignore_unused pd_ignore_unused pmos_rootfsopts=defaults
	initrd /initramfs
	devicetree /msm8992-msft-lumia-octagon-talkman.dtb.prev
}
